<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色对对碰 — 万物心声</title>
<style>
/* ========================================
   角色对对碰 - 卡牌翻面记忆游戏
   设计语言继承主站 CSS
   ======================================== */

:root {
  --bg: #fdf6ec;
  --bg-card: #fffdf7;
  --text: #3d3226;
  --text-light: #7a6e5e;
  --accent: #b5443c;
  --accent-hover: #8b221b;
  --border: #e5d9c4;
  --code-bg: #f5efe0;
  --shadow: 0 2px 16px rgba(0,0,0,0.06);
  --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --green: #4a9c5d;
  --green-bg: #e8f5e9;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1b16;
    --bg-card: #272420;
    --text: #d4c8b4;
    --text-light: #9b8e7a;
    --accent: #d4736a;
    --accent-hover: #e89890;
    --border: #3d3528;
    --code-bg: #2c2822;
    --shadow: 0 2px 16px rgba(0,0,0,0.3);
    --green: #6ec97c;
    --green-bg: #2a382c;
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { font-size: 17px; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.85;
  min-height: 100vh;
}

/* --- 导航栏（复用主站样式） --- */
.navbar {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 1.5rem;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow);
}
.navbar-inner {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.navbar .logo {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent);
  text-decoration: none;
  letter-spacing: 0.05em;
}
.navbar .logo:hover { color: var(--accent-hover); }
.nav-links { display: flex; gap: 1.5rem; }
.nav-links a {
  text-decoration: none;
  color: var(--text-light);
  font-size: 0.9rem;
  transition: color 0.2s;
}
.nav-links a:hover { color: var(--accent); }

/* --- 主容器 --- */
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem 1.25rem 3rem;
}

/* --- 页头 --- */
.game-header {
  text-align: center;
  margin-bottom: 1.5rem;
}
.game-header h1 {
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--accent);
  letter-spacing: 0.05em;
}
.game-header .subtitle {
  font-size: 0.95rem;
  color: var(--text-light);
  margin-top: 0.3rem;
}

/* --- 说明卡片 --- */
.rules-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.5rem;
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow);
  text-align: center;
  font-size: 0.9rem;
  color: var(--text-light);
  cursor: pointer;
  user-select: none;
}
.rules-card .icon { font-size: 1.3rem; margin-right: 0.3rem; }
.rules-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease, margin-top 0.35s ease;
  text-align: left;
  font-size: 0.85rem;
  line-height: 1.7;
}
.rules-card.open .rules-body {
  max-height: 200px;
  margin-top: 0.8rem;
}
.rules-body p { margin-bottom: 0.3rem; }

/* --- 状态栏 --- */
.status-bar {
  display: flex;
  justify-content: center;
  gap: 2.5rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}
.stat {
  text-align: center;
}
.stat .num {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--accent);
}
.stat .label {
  font-size: 0.75rem;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* --- 难度选择 --- */
.difficulty-bar {
  display: flex;
  justify-content: center;
  gap: 0.6rem;
  margin-bottom: 1.5rem;
}
.diff-btn {
  padding: 0.4rem 1.2rem;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--bg-card);
  color: var(--text-light);
  cursor: pointer;
  font-size: 0.85rem;
  font-family: var(--font-body);
  transition: all 0.2s;
}
.diff-btn:hover { border-color: var(--accent); color: var(--accent); }
.diff-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* --- 卡片网格 --- */
.card-grid {
  display: grid;
  gap: 0.8rem;
  justify-content: center;
  margin-bottom: 1.5rem;
  perspective: 1000px;
}
.card-grid.easy   { grid-template-columns: repeat(4, 1fr); max-width: 600px; margin-inline: auto; }
.card-grid.medium { grid-template-columns: repeat(4, 1fr); max-width: 640px; margin-inline: auto; }
.card-grid.hard   { grid-template-columns: repeat(4, 1fr); max-width: 680px; margin-inline: auto; }

/* --- 卡片 --- */
.card {
  aspect-ratio: 3 / 4;
  cursor: pointer;
  position: relative;
}
.card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}
.card.flipped .card-inner { transform: rotateY(180deg); }

.card-front, .card-back {
  position: absolute;
  inset: 0;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  border: 1.5px solid var(--border);
}
.card-front {
  background: var(--bg-card);
  box-shadow: var(--shadow);
}
.card-front .pattern {
  font-size: 1.8rem;
  color: var(--accent);
  opacity: 0.5;
}
.card-back {
  background: var(--bg-card);
  transform: rotateY(180deg);
  box-shadow: var(--shadow);
  padding: 0.6rem;
  text-align: center;
  flex-direction: column;
}
.card-back .card-type {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 0.4rem;
  padding: 0.15rem 0.5rem;
  border-radius: 3px;
  font-weight: 700;
}
.card-back .card-type.name  { background: var(--code-bg); color: var(--accent); border: 1px solid var(--border); }
.card-back .card-type.voice { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
.card-back .card-text {
  font-size: 0.85rem;
  font-weight: 700;
  line-height: 1.4;
  word-break: break-all;
}
.card-back .card-text.name-text  { color: var(--text); }
.card-back .card-text.voice-text { color: var(--text); font-weight: 400; font-style: italic; font-size: 0.78rem; }

/* 已配对 */
.card.matched .card-inner { transform: rotateY(180deg); }
.card.matched .card-back {
  border-color: var(--green);
  box-shadow: 0 0 0 2px var(--green);
}

/* 配对成功动画 */
@keyframes matchPulse {
  0%   { box-shadow: 0 0 0 0 var(--green); }
  50%  { box-shadow: 0 0 0 8px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.card.matched.pulse .card-back { animation: matchPulse 0.6s ease; }

/* 移动端卡片文字缩小 */
@media (max-width: 500px) {
  .card-back .card-text { font-size: 0.7rem; }
  .card-back .card-text.voice-text { font-size: 0.65rem; }
  .card-back .card-type { font-size: 0.55rem; }
  .status-bar { gap: 1.5rem; }
  .game-header h1 { font-size: 1.5rem; }
}

/* --- 按钮 --- */
.btn {
  display: inline-block;
  padding: 0.6rem 1.8rem;
  border: 2px solid var(--accent);
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 700;
  font-family: var(--font-body);
  letter-spacing: 0.04em;
  transition: all 0.2s;
  text-decoration: none;
}
.btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-ghost {
  background: transparent;
  color: var(--accent);
}
.btn-ghost:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-bar {
  display: flex;
  justify-content: center;
  gap: 1rem;
  flex-wrap: wrap;
}

/* --- 胜利弹窗 --- */
.win-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.win-dialog {
  background: var(--bg-card);
  border: 2px solid var(--accent);
  border-radius: 12px;
  padding: 2rem 2.5rem;
  text-align: center;
  box-shadow: 0 8px 40px rgba(0,0,0,0.2);
  max-width: 90vw;
}
.win-dialog .trophy { font-size: 3rem; }
.win-dialog h2 {
  font-size: 1.4rem;
  color: var(--accent);
  margin: 0.5rem 0;
}
.win-dialog .stats { color: var(--text-light); font-size: 0.9rem; margin-bottom: 1.2rem; }
.win-dialog .stars { font-size: 1.6rem; margin-bottom: 1rem; }

/* --- 页脚 --- */
.footer {
  text-align: center;
  color: var(--text-light);
  font-size: 0.8rem;
  padding: 1.5rem 1.25rem;
  opacity: 0.7;
}
.footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <div class="navbar-inner">
    <a href="../index.html" class="logo">万物心声</a>
    <div class="nav-links">
      <a href="../index.html">目录</a>
      <a href="character-match.html">角色对对碰</a>
    </div>
  </div>
</nav>

<div class="container">

  <!-- 页头 -->
  <div class="game-header">
    <h1>🎴 角色对对碰</h1>
    <p class="subtitle">翻开卡牌，找到每个角色的「心声」</p>
  </div>

  <!-- 规则 -->
  <div class="rules-card" id="rulesCard" onclick="toggleRules()">
    <span class="icon">📖</span>游戏规则（点击展开）
    <div class="rules-body">
      <p>🃏 每张<b>人名卡</b>对应一张<b>心声卡</b>——那是角色内心最真实的声音。</p>
      <p>👆 每次翻两张：翻到人名+对应心声 → <b>配对成功</b>；翻错 → 自动翻回。</p>
      <p>🏆 在<b>最少步数</b>内配对所有卡牌！步数越少，评级越高。</p>
    </div>
  </div>

  <!-- 难度 -->
  <div class="difficulty-bar">
    <button class="diff-btn active" onclick="setDifficulty('easy')"   id="diffEasy">  简单 · 4对</button>
    <button class="diff-btn"        onclick="setDifficulty('medium')" id="diffMedium"> 中等 · 6对</button>
    <button class="diff-btn"        onclick="setDifficulty('hard')"   id="diffHard">   困难 · 8对</button>
  </div>

  <!-- 状态 -->
  <div class="status-bar">
    <div class="stat"><div class="num" id="moves">0</div><div class="label">步数</div></div>
    <div class="stat"><div class="num" id="pairs">0/4</div><div class="label">已配对</div></div>
    <div class="stat"><div class="num" id="timer">00:00</div><div class="label">用时</div></div>
  </div>

  <!-- 卡片区 -->
  <div class="card-grid easy" id="cardGrid"></div>

  <!-- 按钮 -->
  <div class="btn-bar">
    <button class="btn" onclick="newGame()">🔄 重新开始</button>
    <a href="../index.html" class="btn btn-ghost">📚 回目录</a>
  </div>

</div>

<div class="footer">
  《万物心声》小说网站 · <a href="../index.html">返回目录</a>
</div>

<!-- ========================================
     游戏逻辑
     ======================================== -->
<script>
// ---------- 题库 ----------
// 每个人物一个对象：name 显示在卡牌上，voice 是配对的心声
const ALL_CHARACTERS = [
  {
    name: '冉峰',
    voice: '“好的收到。”\n——其实想说滚。',
    emoji: '💻',
  },
  {
    name: '余楚乔',
    voice: '“说吧，把你已知的全部告诉我。”\n——冷面下的温柔。',
    emoji: '📋',
  },
  {
    name: '麦杰',
    voice: '“你他妈又憋什么坏呢？”\n——兄弟的直觉。',
    emoji: '🍺',
  },
  {
    name: '胖虎',
    voice: '“我跟你说个八卦，你可别传出去……”\n——下一秒全公司都知道了。',
    emoji: '🍗',
  },
  {
    name: '王磊',
    voice: '“这个功能是我做的，你只是帮忙改了个bug。”\n——抢功专业户。',
    emoji: '🫥',
  },
  {
    name: '零号',
    voice: '“百年了，人类还是那副德性。”\n——虚无主义的尽头。',
    emoji: '🌑',
  },
  {
    name: '甘总',
    voice: '“别跟我谈996，能把活干完就行。”\n——行业异类，白手起家。',
    emoji: '🏢',
  },
  {
    name: '赵志远',
    voice: '“年轻人嘛，多干点没坏处。”\n——压榨下属换业绩的笑面虎。',
    emoji: '🎭',
  },
];

// ---------- 游戏状态 ----------
let characters = [];       // 本局使用的角色列表
let cards = [];            // 当前场上所有卡片
let flippedCards = [];     // 当前已翻开但未配对的卡片索引
let matchedPairs = 0;
let totalPairs = 4;
let moves = 0;
let lockBoard = false;
let timerSec = 0;
let timerInterval = null;

// ---------- DOM 引用 ----------
const grid    = document.getElementById('cardGrid');
const movesEl = document.getElementById('moves');
const pairsEl = document.getElementById('pairs');
const timerEl = document.getElementById('timer');

// ---------- 工具函数 ----------
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

function starRating(m, p) {
  // p = pairs matched, rating based on moves per pair ratio
  const ratio = m / p;
  if (ratio <= 2.0) return '⭐⭐⭐ 完美！你是冉峰本峰！';
  if (ratio <= 3.0) return '⭐⭐ 不错，下次更快！';
  return '⭐ 继续练习心声感应吧！';
}

// ---------- 计时器 ----------
function startTimer() {
  stopTimer();
  timerSec = 0;
  timerEl.textContent = '00:00';
  timerInterval = setInterval(() => {
    timerSec++;
    timerEl.textContent = formatTime(timerSec);
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

// ---------- 创建卡片 ----------
function buildCards() {
  cards = [];
  characters.forEach((ch, idx) => {
    // 人名卡
    cards.push({
      type: 'name',
      charIndex: idx,
      display: ch.name,
      emoji: ch.emoji,
    });
    // 心声卡
    cards.push({
      type: 'voice',
      charIndex: idx,
      display: ch.voice,
    });
  });
  cards = shuffle(cards);
}

// ---------- 渲染网格 ----------
function renderGrid() {
  grid.innerHTML = '';
  cards.forEach((card, i) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.setAttribute('data-index', i);
    div.onclick = () => flipCard(i);

    const nameOrVoice = card.type === 'name' ? 'name' : 'voice';
    const textClass   = card.type === 'name' ? 'name-text' : 'voice-text';
    const typeLabel   = card.type === 'name' ? '人物' : '心声';
    const displayHTML = card.type === 'name'
      ? card.display
      : card.display.replace(/\n/g, '<br>');

    div.innerHTML = `
      <div class="card-inner">
        <div class="card-front">
          <span class="pattern">${card.emoji || '❓'}</span>
        </div>
        <div class="card-back">
          <span class="card-type ${nameOrVoice}">${typeLabel}</span>
          <span class="card-text ${textClass}">${displayHTML}</span>
        </div>
      </div>
    `;
    grid.appendChild(div);
  });
}

// ---------- 翻牌逻辑 ----------
function flipCard(index) {
  if (lockBoard) return;
  const cardEl = grid.children[index];
  if (!cardEl) return;
  if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
  // 不能同时翻两张同类型的（不能让玩家翻两张人名或两张心声来凑对）
  if (flippedCards.length === 1) {
    const firstCard = cards[flippedCards[0]];
    const thisCard  = cards[index];
    if (firstCard.type === thisCard.type) return; // 同类型不允许
  }

  // 翻开
  cardEl.classList.add('flipped');
  flippedCards.push(index);

  if (flippedCards.length === 2) {
    moves++;
    movesEl.textContent = moves;
    lockBoard = true;

    const [i1, i2] = flippedCards;
    const c1 = cards[i1];
    const c2 = cards[i2];

    if (c1.charIndex === c2.charIndex && c1.type !== c2.type) {
      // ✅ 配对成功
      setTimeout(() => {
        const el1 = grid.children[i1];
        const el2 = grid.children[i2];
        el1.classList.add('matched', 'pulse');
        el2.classList.add('matched', 'pulse');
        matchedPairs++;
        pairsEl.textContent = matchedPairs + '/' + totalPairs;
        flippedCards = [];
        lockBoard = false;

        // 检查胜利
        if (matchedPairs === totalPairs) {
          stopTimer();
          setTimeout(showVictory, 400);
        }
      }, 300);
    } else {
      // ❌ 不匹配，翻回去
      setTimeout(() => {
        grid.children[i1].classList.remove('flipped');
        grid.children[i2].classList.remove('flipped');
        flippedCards = [];
        lockBoard = false;
      }, 800);
    }
  }
}

// ---------- 胜利弹窗 ----------
function showVictory() {
  const overlay = document.createElement('div');
  overlay.className = 'win-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="win-dialog">
      <div class="trophy">🏆</div>
      <h2>恭喜通关！</h2>
      <div class="stars">${starRating(moves, totalPairs)}</div>
      <div class="stats">
        用时 ${formatTime(timerSec)} · 步数 ${moves} · 配对 ${totalPairs} 对
      </div>
      <button class="btn" onclick="this.closest('.win-overlay').remove(); newGame();">🔄 再来一局</button>
      <a href="../index.html" class="btn btn-ghost" style="margin-left:0.5rem;">📚 回目录</a>
    </div>
  `;
  document.body.appendChild(overlay);
}

// ---------- 新游戏 ----------
function newGame() {
  stopTimer();
  // 清理胜利弹窗
  const overlay = document.querySelector('.win-overlay');
  if (overlay) overlay.remove();

  flippedCards = [];
  matchedPairs = 0;
  moves = 0;
  lockBoard = false;
  movesEl.textContent = '0';
  pairsEl.textContent = '0/' + totalPairs;

  buildCards();
  renderGrid();
  startTimer();
}

// ---------- 难度切换 ----------
function setDifficulty(level) {
  ['easy','medium','hard'].forEach(l => {
    document.getElementById('diff' + l.charAt(0).toUpperCase() + l.slice(1)).classList.remove('active');
  });
  document.getElementById('diff' + level.charAt(0).toUpperCase() + level.slice(1)).classList.add('active');

  grid.classList.remove('easy', 'medium', 'hard');
  grid.classList.add(level);

  switch (level) {
    case 'easy':   totalPairs = 4; break;
    case 'medium': totalPairs = 6; break;
    case 'hard':   totalPairs = 8; break;
  }
  characters = ALL_CHARACTERS.slice(0, totalPairs);
  newGame();
}

// ---------- 规则展开 ----------
function toggleRules() {
  document.getElementById('rulesCard').classList.toggle('open');
}

// ---------- 启动 ----------
characters = ALL_CHARACTERS.slice(0, 4);
totalPairs = 4;
newGame();
</script>

</body>
</html>
