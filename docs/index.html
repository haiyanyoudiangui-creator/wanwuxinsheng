<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的书架</title>
<link rel="stylesheet" href="css/bookshelf.css">
</head>
<body>

<header class="bookshelf-header">
  <h1>📚 我的书架</h1>
  <p class="subtitle">坐下来，翻开一个世界</p>
</header>

<div class="book-grid">

  <!-- ========== 万物心声 ========== -->
  <a class="book-card" href="books/wanwuxinsheng/index.html">
    <div class="book-cover cover-wanwuxinsheng">
      <span class="cover-badge">连载中</span>
      <div class="cover-text">
        <div class="cover-title">万物心声</div>
        <div class="cover-author">当心脏开口说话，世界从此不同</div>
      </div>
    </div>
    <div class="book-info">
      <div class="book-name">万物心声</div>
      <div class="book-meta">都市 · 系统 · 爽文 · 5章已发布</div>
      <div class="book-desc">冉峰，星辰科技新入职后端程序员，22岁。连续通宵三天后猝死在工位——醒来后，他听到了心脏在骂他。</div>
      <div class="book-tags">
        <span class="book-tag status">连载中</span>
        <span class="book-tag">系统流</span>
        <span class="book-tag">程序员</span>
        <span class="book-tag">🎴 小游戏</span>
      </div>
    </div>
  </a>

  <!-- ========== 未来新书占位 ========== -->
  <div class="book-card new-book">
    <div class="book-cover">
      <div class="cover-text">
        <div class="cover-title">➕ 新书筹备中</div>
        <div class="cover-author">下一段旅程</div>
      </div>
    </div>
    <div class="book-info">
      <div class="book-name">敬请期待</div>
      <div class="book-meta">想法正在发芽 🌱</div>
      <div class="book-desc">下一本书的灵感也许就在某个深夜降临。</div>
      <div class="book-tags">
        <span class="book-tag">未开始</span>
      </div>
    </div>
  </div>

</div>

<footer class="bookshelf-footer">
  <p>每本书都是一扇门，通向一个世界</p>
</footer>

</body>
</html>
